services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      # - "--port"
      # - "4000"